# CI per R-113: build, unit, asyncio-conformance, stress soak,
# benchmark-regression, clippy/fmt/deny/audit.
#
# Spec asks for windows-2022 + windows-11 runners; GitHub-hosted labels
# provide windows-2022 and windows-2025 (Windows Server 2025). A windows-11
# (client) self-hosted runner can be added to the matrix when available.
name: ci

on:
  # Deliberately NOT push-on-feature-branches. A branch with an open PR
  # matched both this and `pull_request`, so every commit started two
  # identical 6-job runs — half of them on Windows runners, which bill at
  # a multiple. Feature branches are covered by the pull_request trigger.
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 4 * * *" # nightly: full soak + benchmark regression
  workflow_dispatch:

# Superseded runs are wasted runs: pushing a follow-up commit while a run
# is still going leaves the old one burning Windows minutes on a revision
# nobody will look at again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - run: cargo fmt --all --check
      - run: cargo clippy -p cadeloop-core --all-targets -- -D warnings
      - name: clippy (windows target)
        run: |
          # pyo3-ffi's PYO3_CROSS build script generates python3.dll's
          # import lib via the python3-dll-a crate, which shells out to a
          # plain `llvm-dlltool` on PATH. rustup's llvm-tools/llvm-tools-
          # preview component does NOT ship it (only llvm-{ar,nm,objcopy,
          # ...} — verified against its actual installed file list); it
          # comes from the OS's own llvm package instead.
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends llvm
          cargo clippy -p cadeloop-core --target x86_64-pc-windows-msvc -- -D warnings
          PYO3_CROSS=1 PYO3_CROSS_PYTHON_VERSION=3.11 \
            cargo clippy -p cadeloop-pyshim --no-default-features \
            --target x86_64-pc-windows-msvc -- -D warnings
      - name: "cargo-deny (licenses: R-014) + cargo-audit"
        run: |
          cargo install --locked cargo-deny cargo-audit
          cargo deny check licenses bans sources
          cargo audit

  test-linux:
    # Portable dev backend: scheduling semantics + facade on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cargo test --workspace
      - name: build extension + pytest
        run: |
          cargo build -p cadeloop-pyshim --release
          cp target/release/lib_core.so python/cadeloop/_core.so
          pip install pytest pytest-timeout uvicorn aiohttp trustme starlette fastapi
          PYTHONPATH=python python -m pytest tests/unit tests/conformance -q --timeout=90

  build-windows:
    # R-113: the authoritative build/test platform.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cargo test --workspace
      - name: build wheel (cp311-win_amd64, R-110)
        run: |
          pip install maturin pytest
          maturin build --release --out dist
          pip install --no-index --find-links dist cadeloop
          pip install pytest-timeout uvicorn aiohttp trustme starlette fastapi
      - name: copy extension into source tree (subprocess tests import from repo PYTHONPATH)
        run: copy target\release\_core.dll python\cadeloop\_core.pyd
      - name: unit + conformance subset
        # ADR-24 diagnostics, Windows only and temporary: the /bg
        # background-task hang (test_starlette_routes_and_streaming) is
        # intermittent and reproduces only here, and pytest-timeout's dump
        # shows the main thread parked in run_forever() without saying why.
        # Both traces are OnceLock-gated and cost nothing when unset, so no
        # other job, benchmark or user pays for them. Remove with the
        # markers once the hang is understood.
        env:
          CADELOOP_TRACE_APP: "1"
          CADELOOP_TRACE_TICK: "1"
        run: python -m pytest tests/unit tests/conformance -q --timeout=120
      - name: CPython asyncio conformance suite (R-120)
        run: python tests/conformance/run_cpython_suite.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  stress:
    # R-113/R-122: soak. Short on PRs; the nightly schedule runs the full
    # 10-minute soak with RSS-growth assertion (<5%).
    runs-on: windows-2022
    needs: build-windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install maturin
          maturin build --release --out dist
          pip install --no-index --find-links dist cadeloop
      - name: soak
        run: python tests/stress/soak_timers.py --seconds ${{ github.event_name == 'schedule' && '600' || '30' }}

  benchmark-regression:
    # R-113: fail on >5% regression vs stored baseline JSON. Until a
    # Windows baseline is recorded under bench/baselines/, the check
    # records results as artifacts and passes.
    runs-on: windows-2022
    needs: build-windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install maturin
          maturin build --release --out dist
          pip install --no-index --find-links dist cadeloop
      - name: scheduling benchmark
        run: python bench/harness/harness.py --suite sched --loops cadeloop --out bench-results.json
      - name: regression gate (>5%)
        # Gates against a CI-RECORDED baseline, deliberately not
        # bench/baselines/windows-sched.json: that one was recorded on the
        # owner's own Windows machine, and a dedicated box vs. a shared
        # GitHub-hosted runner differs by far more than this 5% threshold
        # permanently, so gating on it can never pass regardless of code
        # quality (it read as a 25-69% "regression" across every scheduling
        # benchmark the first time this job ever ran). The local baseline
        # stays as-is for the README/docs comparisons it was made for.
        # Until this file is seeded from a green run's uploaded artifact,
        # check_regression.py passes with a notice, per its own contract.
        run: python bench/harness/check_regression.py bench-results.json bench/baselines/windows-sched-ci.json --threshold 0.05
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results.json
