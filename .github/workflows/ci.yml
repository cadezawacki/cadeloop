# CI per R-113: build, unit, asyncio-conformance, clippy/fmt/deny/audit.
# The soak and benchmark-regression gates live in slow.yml -- see the
# note there for why they cannot share this workflow's concurrency
# policy.
#
# Spec asks for windows-2022 + windows-11 runners; GitHub-hosted labels
# provide windows-2022 and windows-2025 (Windows Server 2025). A windows-11
# (client) self-hosted runner can be added to the matrix when available.
name: ci

on:
  # Deliberately NOT push-on-feature-branches. A branch with an open PR
  # matched both this and `pull_request`, so every commit started two
  # identical 6-job runs — half of them on Windows runners, which bill at
  # a multiple. Feature branches are covered by the pull_request trigger.
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Superseded runs are wasted runs: pushing a follow-up commit while a run
# is still going leaves the old one burning Windows minutes on a revision
# nobody will look at again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs, with the tag they came
# from in a trailing comment. `@v4` is a MOVING tag and
# `dtolnay/rust-toolchain@stable` is a BRANCH -- both re-point on every
# release, so what CI executes was decided by whoever last pushed there,
# not by anything in this repository. The comment is what makes an upgrade
# a reviewable diff instead of an invisible one.
env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - run: cargo fmt --all --check
      - run: cargo clippy -p cadeloop-core --all-targets -- -D warnings
      # pyproject.toml has carried a [tool.ruff] section since the start
      # and nothing ever ran it. The rule set is bug-shaped (pyflakes,
      # bugbear, the ASYNC family) rather than style-shaped -- see the
      # comment on `select` there for what is deliberately left off.
      - name: ruff (python lint)
        run: |
          pipx install ruff==0.16.3 || pip install ruff==0.16.3
          ruff check python/ tests/
      - name: clippy (windows target)
        run: |
          # pyo3-ffi's PYO3_CROSS build script generates python3.dll's
          # import lib via the python3-dll-a crate, which shells out to a
          # plain `llvm-dlltool` on PATH. rustup's llvm-tools/llvm-tools-
          # preview component does NOT ship it (only llvm-{ar,nm,objcopy,
          # ...} — verified against its actual installed file list); it
          # comes from the OS's own llvm package instead.
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends llvm
          cargo clippy -p cadeloop-core --target x86_64-pc-windows-msvc -- -D warnings
          # Once per supported interpreter: what differs between them is
          # compiled in or out (crates/pyshim/build.rs), so each version
          # is its own set of code to lint.
          for py in 3.11 3.12 3.13; do
            PYO3_CROSS=1 PYO3_CROSS_PYTHON_VERSION=$py \
              cargo clippy -p cadeloop-pyshim --no-default-features \
              --target x86_64-pc-windows-msvc -- -D warnings
          done
      - name: "cargo-deny (licenses: R-014) + cargo-audit"
        run: |
          cargo install --locked cargo-deny cargo-audit
          cargo deny check licenses bans sources
          cargo audit

  test-linux:
    # Portable dev backend: scheduling semantics + facade on Linux, on
    # every supported interpreter. 3.11 is the primary one; 3.12 and 3.13
    # each changed asyncio in ways the loop follows (ADR-45), so each is
    # its own build and its own run of everything.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: cargo test --workspace
      - name: build extension + pytest
        run: |
          cargo build -p cadeloop-pyshim --release
          cp target/release/lib_core.so python/cadeloop/_core.so
          pip install pytest pytest-timeout uvicorn aiohttp trustme starlette fastapi
          PYTHONPATH=python python -m pytest tests/unit tests/conformance -q --timeout=90
      - name: the same suites with native TLS on
        # Loop(native_tls=True) is opt-in; this runs everything with it
        # switched on for every loop, so the tests that were not written
        # for it are held to it as well.
        env:
          CADELOOP_NATIVE_TLS: "1"
        run: PYTHONPATH=python python -m pytest tests/unit tests/conformance -q --timeout=90
      - name: CPython asyncio conformance suite (R-120)
        # This interpreter's own asyncio tests, run against cadeloop. The
        # runner says so and passes if the Python it is given ships no
        # `test` package.
        run: PYTHONPATH=python python tests/conformance/run_cpython_suite.py

  build-windows:
    # R-113: the authoritative build/test platform. 3.11 on both Windows
    # images; 3.12 and 3.13 on one, since what differs between the
    # interpreters is the same on either.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, python: "3.11" }
          - { os: windows-2025, python: "3.11" }
          - { os: windows-2025, python: "3.12" }
          - { os: windows-2025, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: cargo test --workspace
      - name: build wheel (win_amd64, R-110)
        run: |
          pip install maturin pytest
          maturin build --release --out dist
          pip install --no-index --find-links dist cadeloop
          pip install pytest-timeout uvicorn aiohttp trustme starlette fastapi
      - name: copy extension into source tree (subprocess tests import from repo PYTHONPATH)
        run: copy target\release\_core.dll python\cadeloop\_core.pyd
      - name: unit + conformance subset
        run: python -m pytest tests/unit tests/conformance -q --timeout=120
      - name: generated differential scenarios (informational on Windows)
        # tests/unit/test_differential.py compares cadeloop with asyncio's
        # selector loop step by step. It is a required check on Linux,
        # where it was developed; on Windows the two loops also differ in
        # ways that are the platform's (a loopback send of any size is
        # taken whole), so here it runs to collect evidence and cannot
        # fail the job until those have been told apart.
        continue-on-error: true
        env:
          CADELOOP_DIFF_WINDOWS: "1"
        run: python -m pytest tests/unit/test_differential.py -q --timeout=120
      - name: CPython asyncio conformance suite (R-120)
        run: python tests/conformance/run_cpython_suite.py
      - name: CPython's TLS suites against native TLS
        # The Rust port of sslproto (Loop(native_tls=True)), held to
        # CPython's own tests of the original.
        env:
          CADELOOP_NATIVE_TLS: "1"
        run: >
          python tests/conformance/run_cpython_suite.py
          test.test_asyncio.test_sslproto test.test_asyncio.test_ssl
          test.test_asyncio.test_events test.test_asyncio.test_streams
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl
