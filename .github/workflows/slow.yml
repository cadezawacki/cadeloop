# R-113 slow validation: the 10-minute soak and the benchmark regression
# gate. Split out of ci.yml because that workflow uses
# `cancel-in-progress: true` -- correct for the fast jobs, since a
# superseded run burns Windows minutes on a revision nobody will look at
# again, but these two are the LAST to start, so during any active work
# session they were cancelled every single time and validated nothing.
#
# Here they queue instead: at most one run in flight and one pending per
# ref, so the soak and the regression gate always complete for a recent
# commit even while commits keep landing.
name: slow

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 4 * * *" # nightly: full soak + benchmark regression
  workflow_dispatch:

concurrency:
  group: slow-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  stress:
    # R-113/R-122: soak. Short on PRs; the nightly schedule runs the full
    # 10-minute soak with RSS-growth assertion (<5%).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: |
          pip install maturin
          maturin build --release --out dist
          pip install --no-index --find-links dist cadeloop
      - name: soak
        run: python tests/stress/soak_timers.py --seconds ${{ github.event_name == 'schedule' && '600' || '30' }}

  differential:
    # tests/unit/test_differential.py over many more seeds than the unit
    # suite runs: a few hundred on a pull request, a few thousand nightly.
    # Against each interpreter's own asyncio: they are not the same loop.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          cargo build -p cadeloop-pyshim --release
          cp target/release/lib_core.so python/cadeloop/_core.so
          pip install pytest pytest-timeout trustme
      - name: generated scenarios
        env:
          CADELOOP_DIFF_SEEDS: ${{ github.event_name == 'schedule' && '3000' || '600' }}
        run: PYTHONPATH=python python -m pytest tests/unit/test_differential.py -q --timeout=120

  soak-features:
    # tests/stress/soak_features.py: the server features a long-running
    # service would have switched on, switched on together -- TLS in the
    # engine, the access log and its Python tap, file sending, WebSocket
    # compression, gc_mode="refreeze", outbound requests and their name
    # lookups -- under mixed load, clients that vanish mid-request
    # included. Fails on memory, descriptor or thread growth after warm-up,
    # a lost log record, a failed request, or anything the loop still
    # holds once every client is gone.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          cargo build -p cadeloop-pyshim --release
          cp target/release/lib_core.so python/cadeloop/_core.so
          pip install fastapi aiohttp websockets trustme
      - name: soak
        run: PYTHONPATH=python python tests/stress/soak_features.py --seconds ${{ github.event_name == 'schedule' && '600' || '60' }}

  properties:
    # The core crate's property tests (the HTTP and WebSocket parsers, the
    # compression codec, the access log's escaping) run a few hundred
    # generated cases each with the unit tests; here they get far more.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - name: generated cases
        env:
          PROPTEST_CASES: ${{ github.event_name == 'schedule' && '50000' || '5000' }}
        run: cargo test -p cadeloop-core --lib props

  benchmark-regression:
    # R-113: fail on >5% regression vs stored baseline JSON. Until a
    # Windows baseline is recorded under bench/baselines/, the check
    # records results as artifacts and passes.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: |
          pip install maturin
          maturin build --release --out dist
          pip install --no-index --find-links dist cadeloop
      - name: scheduling benchmark
        run: python bench/harness/harness.py --suite sched --loops cadeloop --out bench-results.json
      - name: regression gate (>5%)
        # Gates against a CI-RECORDED baseline, deliberately not
        # bench/baselines/windows-sched.json: that one was recorded on the
        # owner's own Windows machine, and a dedicated box vs. a shared
        # GitHub-hosted runner differs by far more than this 5% threshold
        # permanently, so gating on it can never pass regardless of code
        # quality (it read as a 25-69% "regression" across every scheduling
        # benchmark the first time this job ever ran). The local baseline
        # stays as-is for the README/docs comparisons it was made for.
        # Until this file is seeded from a green run's uploaded artifact,
        # check_regression.py passes with a notice, per its own contract.
        run: python bench/harness/check_regression.py bench-results.json bench/baselines/windows-sched-ci.json --threshold 0.05
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-results
          path: bench-results.json
