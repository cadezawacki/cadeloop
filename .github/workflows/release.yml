# Release wheels (R-110/R-111): PGO-optimized cp311-win_amd64, a -v3
# variant (x86-64-v3: AVX2/BMI2/FMA baseline), and the Linux wheel. PGO
# profiles are gathered by running the repo's own benchmark workload
# against an instrumented build — the same hot paths the loop serves in
# production (scheduling, echo, native HTTP).
#
# A `v*` tag push publishes twice: every artifact is attached to the
# GitHub Release for that tag, and everything except the x86-64-v3 wheel
# also goes to PyPI via Trusted Publishing (OIDC, no API token). The v3
# wheel is deliberately withheld from PyPI — it faults on pre-Haswell
# CPUs, which is an acceptable trade for someone who sought out a URL and
# a wrong one to hand `pip install cadeloop`.
#
# workflow_dispatch runs carry no tag: they publish nothing, to either
# destination, and stay run-artifact-only. That is how a build gets
# spot-checked without shipping.
#
# PyPI uploads are IRREVERSIBLE -- a filename, once used, can never be
# reused for that project even after deletion -- so the PyPI job runs
# last, only after the Release job has succeeded.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Least privilege by default; the publishing job opts up to contents:
# write for itself and nothing else does.
permissions:
  contents: read

jobs:
  wheel-windows-pgo:
    runs-on: windows-2022
    strategy:
      matrix:
        variant: [baseline, v3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          components: llvm-tools
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install maturin pytest uvicorn
      - name: variant flags
        shell: bash
        run: |
          if [ "${{ matrix.variant }}" = "v3" ]; then
            echo "ARCH_FLAGS=-C target-cpu=x86-64-v3" >> "$GITHUB_ENV"
          else
            echo "ARCH_FLAGS=" >> "$GITHUB_ENV"
          fi
      - name: build instrumented (profile-generate)
        shell: bash
        run: |
          # cygpath -m, not $PWD: git-bash's POSIX form (/d/a/...) gets
          # baked into the instrumented binary, and the profile runtime
          # -- a plain Windows process -- writes the .profraw files
          # relative to the current drive root instead of the workspace,
          # so the merge step finds no pgo-data at all.
          export RUSTFLAGS="$ARCH_FLAGS -Cprofile-generate=$(cygpath -m "$PWD")/pgo-data"
          cargo build --release -p cadeloop-pyshim
          cp target/release/_core.dll python/cadeloop/_core.pyd
      - name: run the profiling workload (R-111)
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          # Scheduling + timer hot paths.
          for b in call_soon_chain timer_fire threadsafe_throughput future_chain; do
            python bench/sched/bench_sched.py --loop cadeloop --bench "$b" --scale 200000
          done
          # Native HTTP engine hot path: serve + hammer briefly.
          python - <<'EOF'
          import threading, time, urllib.request, cadeloop
          async def app(scope, receive, send):
              if scope["type"] != "http":
                  return
              await receive()
              await send({"type": "http.response.start", "status": 200, "headers": []})
              await send({"type": "http.response.body", "body": b"pgo"})
          lp = cadeloop.new_event_loop()
          lid, bound, _ = lp._core.http_listen("127.0.0.1", 0, app, lp)
          failure = []
          def hammer():
              # The stop MUST be in a finally: if any request raises (the
              # listener not ready, a timeout, the instrumented server
              # dying mid-run) the thread used to exit while the main
              # thread stayed in run_forever() forever, stalling both
              # matrix release jobs until the workflow timeout.
              try:
                  time.sleep(0.3)
                  for _ in range(3000):
                      urllib.request.urlopen(f"http://127.0.0.1:{bound[1]}/", timeout=5).read()
              except BaseException as exc:
                  failure.append(exc)
              finally:
                  lp.call_soon_threadsafe(lp.stop)
          t = threading.Thread(target=hammer)
          t.start()
          lp.run_forever(); t.join(); lp.close()
          if failure:
              raise SystemExit(f"PGO training workload failed: {failure[0]!r}")
          EOF
      - name: merge profiles
        shell: bash
        run: |
          PROFDATA=$(find "$(rustc --print sysroot)" -name llvm-profdata.exe | head -1)
          "$PROFDATA" merge -o pgo-data/merged.profdata pgo-data
      - name: build optimized (profile-use) wheel
        shell: bash
        run: |
          # Same cygpath -m dance: rustc is a Windows process and cannot
          # read the POSIX-form path either.
          export RUSTFLAGS="$ARCH_FLAGS -Cprofile-use=$(cygpath -m "$PWD")/pgo-data/merged.profdata"
          maturin build --release --out dist
          # Both matrix legs emit a byte-different wheel under the SAME
          # PEP 427 filename -- same project, version, cp311, win_amd64 --
          # which collides the moment they share a Release or a
          # --find-links directory. Disambiguate with the build tag, the
          # one filename field that exists for this and that pip parses
          # rather than rejects. pip orders build tags as (int, str) with
          # "absent" lowest, so baseline's `2` outranks v3's `1v3`: point
          # pip at a directory holding both and it resolves to the wheel
          # that runs on any x86-64, never the one that dies with an
          # illegal instruction on a pre-Haswell CPU. Picking v3 has to
          # be explicit -- name the file, or install it on its own.
          case "${{ matrix.variant }}" in
            v3) BUILD_TAG=1v3 ;;
            *)  BUILD_TAG=2 ;;
          esac
          for whl in dist/*.whl; do
            retagged="dist/$(basename "$whl" | sed -E "s/^([^-]+-[^-]+)-/\1-${BUILD_TAG}-/")"
            if [ "$whl" = "$retagged" ]; then
              echo "cannot place a build tag in $whl -- unexpected wheel name" >&2
              exit 1
            fi
            mv "$whl" "$retagged"
          done
          ls -l dist
      - name: smoke the wheel
        shell: bash
        run: |
          pip install --force-reinstall dist/*.whl
          python -c "import cadeloop; lp = cadeloop.new_event_loop(); print(lp.stats()['backend']); lp.close()"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-win-pgo-${{ matrix.variant }}
          path: dist/*.whl

  wheel-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      # The sdist is the only install route where no wheel matches --
      # aarch64, musl, a future CPython. The Rust sources gate on OS, not
      # on CPU, so those builds are plausible; without an sdist they are
      # not even attemptable.
      #
      # Built BEFORE the container step so `dist/` is created by the
      # runner user. The reverse order leaves a root-owned directory
      # behind and this step fails writing into it.
      - run: pip install maturin && maturin sdist --out dist
      # Built inside the manylinux2014 container (glibc 2.17), not against
      # the runner's own glibc. A plain `maturin build` on ubuntu-latest
      # links 2.39 and gets tagged manylinux_2_39, which pip then refuses
      # to install on Debian 12, RHEL 9, or Ubuntu 22.04 -- i.e. most of
      # the installed base. Fine while these were run artifacts a human
      # picked by hand; not fine as the wheel PyPI hands to everyone.
      - uses: PyO3/maturin-action@3e2bdf6ba6453a61e649744019b8a2d906c7eb38 # v1.51.0
        with:
          command: build
          args: --release --out dist
          manylinux: "2014"
          target: x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-linux
          path: dist/*

  github-release:
    # A Release hangs off a tag, and only the tag-push trigger has one.
    # A workflow_dispatch run -- the way a build gets spot-checked
    # off-cycle -- publishes nothing and leaves its wheels as run
    # artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheel-windows-pgo, wheel-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release and upload its assets
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true
      - name: attach the wheels to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # An unmatched glob below would otherwise survive as its own
          # literal text and get published into the notes as a filename.
          shopt -s failglob
          ls -l dist
          # merge-multiple flattens every artifact into one directory and
          # resolves a name clash by silently overwriting, which would
          # publish two wheels as one. The build tags upstream keep the
          # names distinct; this asserts they did. Bump the count when
          # the build matrix grows.
          wheels=$(ls dist/*.whl | wc -l)
          sdists=$(ls dist/*.tar.gz | wc -l)
          if [ "$wheels" -ne 3 ] || [ "$sdists" -ne 1 ]; then
            echo "expected 3 wheels + 1 sdist, found $wheels + $sdists -- names collided?" >&2
            exit 1
          fi
          WIN_BASELINE=$(basename dist/*-2-cp311-*win_amd64.whl)
          WIN_V3=$(basename dist/*-1v3-cp311-*win_amd64.whl)
          LINUX=$(basename dist/*linux*.whl)
          SDIST=$(basename dist/*.tar.gz)

          cat > notes.md <<'EOF'
          Prebuilt CPython 3.11 wheels, built and smoke-tested by
          `.github/workflows/release.yml`.

          | wheel | target | build |
          | --- | --- | --- |
          | `@WIN_BASELINE@` | Windows x64 | PGO, portable x86-64 baseline |
          | `@WIN_V3@` | Windows x64, **v3 CPUs only** | PGO + `-C target-cpu=x86-64-v3` |
          | `@LINUX@` | Linux x64 (manylinux2014) | release build, no PGO |
          | `@SDIST@` | source | for platforms with no wheel above |

          Everything here except the `1v3` wheel is also on PyPI, so
          `pip install cadeloop` gets you the same bits.

          **Take the baseline Windows wheel unless every target CPU is
          known to be Haswell (2013) / Zen 1 (2017) or newer.** The `1v3`
          wheel is compiled to the x86-64-v3 microarchitecture level
          (AVX2, BMI1/BMI2, FMA, F16C) with no runtime dispatch and no CPU
          check: on an older processor it does not fall back and does not
          raise, it dies with an illegal-instruction fault on import.
          Both Windows wheels are otherwise identical — same source, same
          PGO profiles, gathered by running this repo's scheduling and
          native-HTTP workload against an instrumented build.

          The two Windows wheels differ only by PEP 427 build tag, so pip
          resolves a directory holding both to the portable `2` wheel;
          installing the v3 one means naming it.

          To pin the v3 wheel, which PyPI does not carry, install it by URL:

          ```
          pip install https://github.com/@REPO@/releases/download/@TAG@/@WIN_V3@
          ```
          EOF
          sed -i "s|@WIN_BASELINE@|$WIN_BASELINE|g; s|@WIN_V3@|$WIN_V3|g; s|@LINUX@|$LINUX|g; s|@SDIST@|$SDIST|g; s|@TAG@|$TAG|g; s|@REPO@|$GITHUB_REPOSITORY|g" notes.md

          # A retried matrix leg re-runs this job against a tag that has
          # already published, so replace the assets instead of failing
          # the run on "release already exists".
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            # --verify-tag: publish against the pushed tag or not at all,
            # never conjure a tag from whatever the default branch is now.
            flags=(--verify-tag)
            # Semver spelling: v1.2.0-rc.1 is a pre-release, v1.2.0 is not.
            case "$TAG" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "cadeloop $TAG" \
              --notes-file notes.md \
              "${flags[@]}"
          fi

  pypi-publish:
    # Runs only after the Release is up. Both steps are recoverable on
    # their own, but the ordering matters anyway: a Release can be
    # rewritten, a PyPI filename cannot, so the reversible half goes
    # first and gets to fail cheaply.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [github-release]
    runs-on: ubuntu-latest
    permissions:
      # Trusted Publishing: the job mints a short-lived OIDC token PyPI
      # verifies against the publisher configured for this repo and
      # workflow filename. No API token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: all
          pattern: wheel-*
          merge-multiple: true
      - name: select what PyPI gets
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s failglob
          mkdir -p dist
          # Everything except the v3 wheel. pip's build-tag ordering already
          # prefers the baseline, but "prefers" is the wrong guarantee for
          # an index everyone installs from without reading: a resolver
          # quirk, a mirror that reorders, or a user pinning by build tag
          # would hand somebody a wheel that dies on their CPU. It stays a
          # GitHub Release asset, reachable only by explicit URL.
          cp all/*-2-cp311-*win_amd64.whl dist/
          cp all/*linux*.whl dist/
          cp all/*.tar.gz dist/

          # The version in these filenames comes from Cargo.toml, and the
          # tag comes from whoever typed `git tag`. Nothing has forced
          # those to agree until now -- and a mismatch is unfixable here,
          # because the wrong version burns that filename on PyPI forever.
          VERSION="${TAG#v}"
          for f in dist/*; do
            case "$(basename "$f")" in
              cadeloop-"$VERSION"-*.whl|cadeloop-"$VERSION".tar.gz) ;;
              *)
                echo "tag $TAG implies version $VERSION, but built $(basename "$f")" >&2
                echo "bump the workspace version in Cargo.toml, or retag." >&2
                exit 1
                ;;
            esac
          done
          ls -l dist
      - uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
        with:
          packages-dir: dist
          # An artifact re-download after a partial upload would otherwise
          # fail the whole job on files PyPI already has.
          skip-existing: true
