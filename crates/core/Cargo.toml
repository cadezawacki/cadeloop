[package]
name = "cadeloop-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CadeLoop L0 (kernel I/O backends) + L1 (reactor) — no Python dependencies"

[build-dependencies]
cc = "1"

[dependencies]
crossbeam-queue.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The IOCP backend's per-socket maps (integer keys; looked up per post).
rustc-hash = "2"
windows-sys = { version = "0.59", features = [
    "Wdk_System_IO", # NtDeviceIoControlFile: IOCTL_AFD_POLL readiness (R-057)
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader", # rio_probe: resolve which module a fn pointer lives in
    "Win32_System_SystemInformation", # rio_probe: detect x64-on-ARM64 emulation
] }

[dev-dependencies]
proptest = "1"

# tests/buffer_residency.rs runs under the extension's own allocator
# (R-070): what a slab region costs depends on who allocates it.
[target.'cfg(target_os = "linux")'.dev-dependencies]
mimalloc = { version = "0.1", default-features = false }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
