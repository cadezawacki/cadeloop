[package]
name = "cadeloop-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CadeLoop L0 (kernel I/O backends) + L1 (reactor) — no Python dependencies"

[build-dependencies]
cc = "1"

[dependencies]
crossbeam-queue.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader", # rio_probe: resolve which module a fn pointer lives in
] }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
