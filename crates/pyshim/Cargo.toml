[package]
name = "cadeloop-pyshim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CadeLoop PyO3 bindings (the cadeloop._core extension module)"

[lib]
name = "cadeloop_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
cadeloop-core = { path = "../core" }
# R-012: PyO3 >= 0.21. Pinned minor for reproducible builds.
pyo3 = { version = "0.24", features = ["extension-module", "generate-import-lib"] }
# R-070: mimalloc as the extension's global allocator.
mimalloc = { version = "0.1", default-features = false }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
