[workspace]
resolver = "2"
members = ["crates/core", "crates/pyshim"]

[workspace.package]
version = "0.0.2"
edition = "2026"
license = "MIT"
repository = "https://github.com/cadezawacki/cadeloop"

[workspace.dependencies]
crossbeam-queue = "0.3"

# R-111: LTO=fat, opt-level=3, codegen-units=1, panic=abort for release.
[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "abort"

[profile.release.package."*"]
opt-level = 3
