<text x="590.6" y="95.0" font-size="12" font-weight="600" text-anchor="end" fill="#52514e">after they close</text>
<text x="708.4" y="95.0" font-size="12" font-weight="600" text-anchor="end" fill="#52514e">handles / conn</text>
