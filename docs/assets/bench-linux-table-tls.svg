<text x="24" y="218.0" font-size="11" fill="#898781">A place is shared when the 96% confidence intervals of two medians overlap: the runs did not tell those two apart.</text>
<text x="24" y="236.0" font-size="11" fill="#898781">New connections: 16 at a time, a full TLS 1.3 handshake for each request, under an ECDSA P-256 certificate and under an RSA 2048 one.</text>
