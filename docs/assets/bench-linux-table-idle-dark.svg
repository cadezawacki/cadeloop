<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 762 356" width="762" height="356" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Idle keep-alive connections · Linux</title>
<rect width="762" height="356" fill="#0B0D11" rx="8"/>
<text x="24" y="42" font-size="16" font-weight="600" fill="#ffffff">Idle keep-alive connections · Linux</text>
<text x="24" y="62" font-size="12" fill="#c9d1d9">each of 5,000 connections made one request and was held open · unique memory (USS) of the server</text>
