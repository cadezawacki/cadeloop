<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Loop timer icon</title>
  <desc id="desc">Two cyan arrows form a loop around a clock hand.</desc>
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#22272F" stroke-width="0.5"/>
    </pattern>
  </defs>
  <style>
    .frame { fill: #0B0D11; stroke: #2A3038; stroke-width: 2; }
    .loop { fill: none; stroke: #00F0D1; stroke-width: 6; stroke-linecap: square; }
    .hand { fill: none; stroke: #FFFFFF; stroke-width: 5; stroke-linecap: square; }
  </style>
  <rect class="frame" x="1" y="1" width="94" height="94" rx="12"/>
  <rect x="8" y="8" width="80" height="80" rx="7" fill="url(#grid)" opacity="0.58"/>
  <path class="loop" d="M25 30A29 29 0 0 1 70 31"/>
  <path d="M69 20 76 33 61 35Z" fill="#A7F9F1"/>
  <path class="loop" d="M71 66A29 29 0 0 1 26 65"/>
  <path d="M27 76 20 63 35 61Z" fill="#A7F9F1"/>
  <rect x="44" y="44" width="8" height="8" fill="#00F0D1"/>
  <path class="hand" d="M48 44V29M52 50l12 9"/>
  <rect x="17" y="46" width="5" height="5" fill="#303640"/>
  <rect x="74" y="46" width="5" height="5" fill="#303640"/>
</svg>
