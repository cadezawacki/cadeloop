<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="tdTitle tdDesc">
<title id="tdTitle">cadeloop terminal session</title>
<desc id="tdDesc">Installing cadeloop with pip, starting a four-worker ASGI server on port 8000, and a curl request returning Hello, World!</desc>
<style>
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 17px; }
  .lbl { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 12px; letter-spacing: 1.6px; }
  .sig { fill: #00F0D1; }
  .soft { fill: #A7F9F1; }
  .txt { fill: #FFFFFF; }
  .dim { fill: #8B93A1; }
</style>

<rect width="1200" height="470" rx="14" fill="#0B0D11"/>
<rect x="1" y="1" width="1198" height="468" rx="13" fill="none" stroke="#171A1F" stroke-width="2"/>

<!-- title bar -->
<rect x="24" y="24" width="1152" height="42" rx="9" fill="#171A1F"/>
<circle cx="48" cy="45" r="5.5" fill="#2A2F38"/>
<circle cx="68" cy="45" r="5.5" fill="#2A2F38"/>
<circle cx="88" cy="45" r="5.5" fill="#00F0D1" opacity="0.75"/>
<text x="112" y="50" class="lbl dim">CADELOOP / SHELL</text>
<text x="1152" y="50" class="lbl sig" text-anchor="end">READY</text>

<!-- session -->
<text x="48" y="110" class="m"><tspan class="sig">$</tspan><tspan class="txt" dx="12">pip install cadeloop</tspan></text>

<text x="48" y="152" class="m"><tspan class="sig">$</tspan><tspan class="txt" dx="12">cadeloop myapp:app --host 0.0.0.0 --port 8000 --workers 4</tspan></text>
<text x="48" y="184" class="m soft">cadeloop supervisor: 4 workers on http://0.0.0.0:8000</text>
<text x="48" y="212" class="m dim">cadeloop worker 0 serving on http://0.0.0.0:8000</text>
<text x="48" y="240" class="m dim">cadeloop worker 1 serving on http://0.0.0.0:8000</text>
<text x="48" y="268" class="m dim">cadeloop worker 2 serving on http://0.0.0.0:8000</text>
<text x="48" y="296" class="m dim">cadeloop worker 3 serving on http://0.0.0.0:8000</text>

<text x="48" y="342" class="m"><tspan class="sig">$</tspan><tspan class="txt" dx="12">curl -s localhost:8000</tspan></text>
<text x="48" y="374" class="m soft">Hello, World!</text>

<!-- footer strip -->
<line x1="48" y1="404" x2="1152" y2="404" stroke="#171A1F" stroke-width="2"/>
<text x="48" y="434" class="lbl dim">NATIVE HTTP ENGINE / RUST PARSE + SCOPE + SERIALIZE</text>
<!-- Two elements, not tspans: text-anchor="end" applies to the whole
     <text>, so a trailing colored tspan lands outside the box in several
     renderers and silently disappears. -->
<text x="1024" y="434" class="lbl dim" text-anchor="end">LINUX LOOPBACK BENCHMARK</text>
<text x="1152" y="434" class="lbl sig" text-anchor="end">104.7K REQ/S</text>
</svg>
