<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 762 356" width="762" height="356" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Idle keep-alive connections · Linux</title>
<rect width="762" height="356" fill="#fcfcfb" rx="8"/>
<text x="24" y="42" font-size="16" font-weight="600" fill="#0b0b0b">Idle keep-alive connections · Linux</text>
<text x="24" y="62" font-size="12" fill="#52514e">each of 5,000 connections made one request and was held open · unique memory (USS) of the server</text>
<text x="38.0" y="95.0" font-size="12" font-weight="600" fill="#52514e">server</text>
<text x="238.1" y="95.0" font-size="12" font-weight="600" text-anchor="end" fill="#52514e">at rest</text>
<text x="353.6" y="95.0" font-size="12" font-weight="600" text-anchor="end" fill="#52514e">holding 5,000</text>
<text x="482.8" y="95.0" font-size="12" font-weight="600" text-anchor="end" fill="#52514e">per connection</text>
<text x="622.9" y="95.0" font-size="12" font-weight="600" text-anchor="end" fill="#52514e">after they close</text>
<text x="723.6" y="95.0" font-size="12" font-weight="600" text-anchor="end" fill="#52514e">fds / conn</text>
