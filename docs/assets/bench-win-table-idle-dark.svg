<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 746 278" width="746" height="278" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Idle keep-alive connections · Windows 11</title>
<rect width="746" height="278" fill="#0B0D11" rx="8"/>
