<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>cadeloop's layers</title>
<rect width="840" height="470" rx="10" fill="#fcfcfb"/>
<text x="24.0" y="34.0" font-size="16" fill="#1f2328" font-weight="600">cadeloop's layers</text>
<text x="24.0" y="55.0" font-size="12.5" fill="#4b535d">Under your code there is a thin Python layer for the asyncio API; everything below it is Rust.</text>
<rect x="24.0" y="78.0" width="560.0" height="50.0" rx="9" fill="#dde7fb" stroke="#3a6fd8" stroke-width="1.2"/>
<text x="42.0" y="99.0" font-size="13.5" fill="#1f2328" font-weight="600">Your code</text>
<text x="42.0" y="117.0" font-size="11.5" fill="#4b535d">asyncio programs, FastAPI, Starlette, aiohttp, uvicorn</text>
<text x="568.0" y="108.0" font-size="11" fill="#3a6fd8" font-weight="600" text-anchor="end">Python</text>
<rect x="24.0" y="138.0" width="560.0" height="50.0" rx="9" fill="#dde7fb" stroke="#3a6fd8" stroke-width="1.2"/>
<text x="42.0" y="159.0" font-size="13.5" fill="#1f2328" font-weight="600">cadeloop, Python layer</text>
<text x="42.0" y="177.0" font-size="11.5" fill="#4b535d">Loop (the asyncio API) · Config · serve() · the CLI</text>
<text x="568.0" y="168.0" font-size="11" fill="#3a6fd8" font-weight="600" text-anchor="end">Python</text>
<rect x="24.0" y="198.0" width="560.0" height="50.0" rx="9" fill="#d3f1ec" stroke="#13968e" stroke-width="1.2"/>
<text x="42.0" y="219.0" font-size="13.5" fill="#1f2328" font-weight="600">Bindings and HTTP engine</text>
<text x="42.0" y="237.0" font-size="11.5" fill="#4b535d">callbacks, transports, HTTP and WebSocket parsing, ASGI</text>
<text x="568.0" y="228.0" font-size="11" fill="#13968e" font-weight="600" text-anchor="end">Rust</text>
<rect x="24.0" y="258.0" width="560.0" height="50.0" rx="9" fill="#d3f1ec" stroke="#13968e" stroke-width="1.2"/>
<text x="42.0" y="279.0" font-size="13.5" fill="#1f2328" font-weight="600">Reactor</text>
<text x="42.0" y="297.0" font-size="11.5" fill="#4b535d">ready queue, timer heap, cross-thread queue, spin-then-park</text>
<text x="568.0" y="288.0" font-size="11" fill="#13968e" font-weight="600" text-anchor="end">Rust</text>
<rect x="24.0" y="318.0" width="560.0" height="50.0" rx="9" fill="#d3f1ec" stroke="#13968e" stroke-width="1.2"/>
<text x="42.0" y="339.0" font-size="13.5" fill="#1f2328" font-weight="600">Backends</text>
<text x="42.0" y="357.0" font-size="11.5" fill="#4b535d">IOCP on Windows · epoll on Linux · RIO (experimental)</text>
<text x="568.0" y="348.0" font-size="11" fill="#13968e" font-weight="600" text-anchor="end">Rust</text>
<rect x="24.0" y="378.0" width="560.0" height="50.0" rx="9" fill="#eceff2" stroke="#6e7781" stroke-width="1.2"/>
<text x="42.0" y="399.0" font-size="13.5" fill="#1f2328" font-weight="600">Operating system</text>
<text x="42.0" y="417.0" font-size="11.5" fill="#4b535d">sockets, timers, the network stack</text>
<text x="568.0" y="408.0" font-size="11" fill="#6e7781" font-weight="600" text-anchor="end">kernel</text>
<path d="M608,78 h10 V316 h-10" fill="none" stroke="#3a6fd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="628.0" y="198.0" font-size="11.5" fill="#4b535d">Python's GIL is held</text>
<text x="628.0" y="213.0" font-size="11.5" fill="#4b535d">while the loop runs</text>
<text x="628.0" y="228.0" font-size="11.5" fill="#4b535d">callbacks and code</text>
<rect x="608.0" y="326.0" width="220.0" height="52.0" rx="8" fill="#fbe6d2" stroke="#c4620c" stroke-width="1.2"/>
<text x="620.0" y="346.0" font-size="11.5" fill="#1f2328">GIL released only here, while</text>
<text x="620.0" y="361.0" font-size="11.5" fill="#1f2328">the backend waits for I/O</text>
</svg>
