<rect x="360.0" y="92.0" width="31.0" height="26.0" rx="4" fill="#36c2b6"/>
<rect x="395.0" y="92.0" width="31.0" height="26.0" rx="4" fill="#0e3733" stroke="#36c2b6" stroke-width="1.2"/>
<rect x="430.0" y="92.0" width="31.0" height="26.0" rx="4" fill="#0B0D11" stroke="#3b434d" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="465.0" y="92.0" width="31.0" height="26.0" rx="4" fill="#36c2b6"/>
<rect x="500.0" y="92.0" width="31.0" height="26.0" rx="4" fill="#0e3733" stroke="#36c2b6" stroke-width="1.2"/>
<rect x="535.0" y="92.0" width="31.0" height="26.0" rx="4" fill="#0B0D11" stroke="#3b434d" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="570.0" y="92.0" width="31.0" height="26.0" rx="4" fill="#36c2b6"/>
<rect x="605.0" y="92.0" width="31.0" height="26.0" rx="4" fill="#0e3733" stroke="#36c2b6" stroke-width="1.2"/>
