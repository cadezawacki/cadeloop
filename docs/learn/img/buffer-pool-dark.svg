<rect x="500.0" y="138.0" width="66.0" height="26.0" rx="4" fill="#0B0D11" stroke="#3b434d" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="570.0" y="138.0" width="66.0" height="26.0" rx="4" fill="#36c2b6"/>
<rect x="640.0" y="138.0" width="66.0" height="26.0" rx="4" fill="#0e3733" stroke="#36c2b6" stroke-width="1.2"/>
<text x="24.0" y="202.0" font-size="12.5" fill="#e6edf3" font-weight="600">64 KiB slots</text>
<rect x="150.0" y="184.0" width="136.0" height="26.0" rx="4" fill="#36c2b6"/>
<rect x="290.0" y="184.0" width="136.0" height="26.0" rx="4" fill="#0e3733" stroke="#36c2b6" stroke-width="1.2"/>
