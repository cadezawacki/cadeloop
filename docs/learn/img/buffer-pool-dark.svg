<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Where received bytes go</title>
<rect width="860" height="300" rx="10" fill="#0B0D11"/>
<text x="24.0" y="34.0" font-size="16" fill="#e6edf3" font-weight="600">Where received bytes go</text>
<text x="24.0" y="55.0" font-size="12.5" fill="#b1bac4">Reads land in slots carved from 2 MiB regions. A slot is reused, not freed, once its data has been used.</text>
<text x="24.0" y="110.0" font-size="12.5" fill="#e6edf3" font-weight="600">4 KiB slots</text>
<rect x="150.0" y="92.0" width="31.0" height="26.0" rx="4" fill="#36c2b6"/>
