<rect x="150.0" y="238.0" width="14.0" height="12.0" rx="3" fill="#36c2b6"/>
<text x="170.0" y="248.0" font-size="11.5" fill="#b1bac4">holding data (a read, or a memoryview you kept)</text>
<rect x="494.7" y="238.0" width="14.0" height="12.0" rx="3" fill="#0e3733" stroke="#36c2b6" stroke-width="1"/>
<text x="514.7" y="248.0" font-size="11.5" fill="#b1bac4">free, kept warm</text>
<rect x="150.0" y="262.0" width="14.0" height="12.0" rx="3" fill="#0B0D11" stroke="#3b434d" stroke-width="1"/>
<text x="170.0" y="272.0" font-size="11.5" fill="#b1bac4">free beyond the warm set: handed back to the OS</text>
<text x="730.0" y="110.0" font-size="11" fill="#b1bac4">bigger reads move</text>
<text x="730.0" y="125.0" font-size="11" fill="#b1bac4">up a size class;</text>
<text x="730.0" y="140.0" font-size="11" fill="#b1bac4">small ones move</text>
<text x="730.0" y="155.0" font-size="11" fill="#b1bac4">back down</text>
</svg>
