<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Where a request spends its time</title>
<rect width="900" height="330" rx="10" fill="#fcfcfb"/>
<text x="24.0" y="34.0" font-size="16" fill="#1f2328" font-weight="600">Where a request spends its time</text>
<text x="24.0" y="55.0" font-size="12.5" fill="#4b535d">uvicorn does the HTTP work in Python (or C with httptools). cadeloop serve() leaves only your app in Python.</text>
<text x="24.0" y="84.0" font-size="13" fill="#1f2328" font-weight="600">uvicorn on asyncio or uvloop</text>
<rect x="24.0" y="98.0" width="124.0" height="46.0" rx="8" fill="#ebe3fb" stroke="#8250df" stroke-width="1.2"/>
<text x="86.0" y="118.0" font-size="12.5" fill="#1f2328" font-weight="600" text-anchor="middle">read bytes</text>
<text x="86.0" y="135.0" font-size="10.5" fill="#4b535d" text-anchor="middle">loop</text>
<line x1="150.0" y1="121.0" x2="163.2" y2="121.0" stroke="#4b535d" stroke-width="1.5"/>
<path d="M168.0,121.0 L162.8,124.0 L162.8,118.0 z" fill="#4b535d"/>
<rect x="170.0" y="98.0" width="124.0" height="46.0" rx="8" fill="#dde7fb" stroke="#3a6fd8" stroke-width="1.2"/>
<text x="232.0" y="118.0" font-size="12.5" fill="#1f2328" font-weight="600" text-anchor="middle">parse HTTP</text>
<text x="232.0" y="135.0" font-size="10.5" fill="#4b535d" text-anchor="middle">h11 or httptools</text>
<line x1="296.0" y1="121.0" x2="309.2" y2="121.0" stroke="#4b535d" stroke-width="1.5"/>
<path d="M314.0,121.0 L308.8,124.0 L308.8,118.0 z" fill="#4b535d"/>
<rect x="316.0" y="98.0" width="124.0" height="46.0" rx="8" fill="#dde7fb" stroke="#3a6fd8" stroke-width="1.2"/>
<text x="378.0" y="118.0" font-size="12.5" fill="#1f2328" font-weight="600" text-anchor="middle">build scope</text>
<text x="378.0" y="135.0" font-size="10.5" fill="#4b535d" text-anchor="middle">Python</text>
<line x1="442.0" y1="121.0" x2="455.2" y2="121.0" stroke="#4b535d" stroke-width="1.5"/>
<path d="M460.0,121.0 L454.8,124.0 L454.8,118.0 z" fill="#4b535d"/>
<rect x="462.0" y="98.0" width="124.0" height="46.0" rx="8" fill="#dde7fb" stroke="#3a6fd8" stroke-width="1.2"/>
<text x="524.0" y="118.0" font-size="12.5" fill="#1f2328" font-weight="600" text-anchor="middle">your app</text>
<text x="524.0" y="135.0" font-size="10.5" fill="#4b535d" text-anchor="middle">Python</text>
<line x1="588.0" y1="121.0" x2="601.2" y2="121.0" stroke="#4b535d" stroke-width="1.5"/>
<path d="M606.0,121.0 L600.8,124.0 L600.8,118.0 z" fill="#4b535d"/>
<rect x="608.0" y="98.0" width="124.0" height="46.0" rx="8" fill="#dde7fb" stroke="#3a6fd8" stroke-width="1.2"/>
<text x="670.0" y="118.0" font-size="12.5" fill="#1f2328" font-weight="600" text-anchor="middle">encode reply</text>
<text x="670.0" y="135.0" font-size="10.5" fill="#4b535d" text-anchor="middle">Python</text>
<line x1="734.0" y1="121.0" x2="747.2" y2="121.0" stroke="#4b535d" stroke-width="1.5"/>
<path d="M752.0,121.0 L746.8,124.0 L746.8,118.0 z" fill="#4b535d"/>
<rect x="754.0" y="98.0" width="124.0" height="46.0" rx="8" fill="#ebe3fb" stroke="#8250df" stroke-width="1.2"/>
<text x="816.0" y="118.0" font-size="12.5" fill="#1f2328" font-weight="600" text-anchor="middle">write</text>
<text x="816.0" y="135.0" font-size="10.5" fill="#4b535d" text-anchor="middle">loop</text>
<text x="24.0" y="166.0" font-size="11.5" fill="#4b535d">With h11, Python runs four of the six steps for every request; httptools moves the parsing to C.</text>
<text x="24.0" y="200.0" font-size="13" fill="#1f2328" font-weight="600">cadeloop serve()</text>
<rect x="24.0" y="214.0" width="124.0" height="46.0" rx="8" fill="#d3f1ec" stroke="#13968e" stroke-width="1.2"/>
<text x="86.0" y="234.0" font-size="12.5" fill="#1f2328" font-weight="600" text-anchor="middle">receive</text>
<text x="86.0" y="251.0" font-size="10.5" fill="#4b535d" text-anchor="middle">pooled buffer</text>
<line x1="150.0" y1="237.0" x2="163.2" y2="237.0" stroke="#4b535d" stroke-width="1.5"/>
<path d="M168.0,237.0 L162.8,240.0 L162.8,234.0 z" fill="#4b535d"/>
<rect x="170.0" y="214.0" width="124.0" height="46.0" rx="8" fill="#d3f1ec" stroke="#13968e" stroke-width="1.2"/>
<text x="232.0" y="234.0" font-size="12.5" fill="#1f2328" font-weight="600" text-anchor="middle">parse HTTP</text>
<text x="232.0" y="251.0" font-size="10.5" fill="#4b535d" text-anchor="middle">llhttp</text>
<line x1="296.0" y1="237.0" x2="309.2" y2="237.0" stroke="#4b535d" stroke-width="1.5"/>
<path d="M314.0,237.0 L308.8,240.0 L308.8,234.0 z" fill="#4b535d"/>
<rect x="316.0" y="214.0" width="124.0" height="46.0" rx="8" fill="#d3f1ec" stroke="#13968e" stroke-width="1.2"/>
<text x="378.0" y="234.0" font-size="12.5" fill="#1f2328" font-weight="600" text-anchor="middle">build scope</text>
<text x="378.0" y="251.0" font-size="10.5" fill="#4b535d" text-anchor="middle">Rust</text>
<line x1="442.0" y1="237.0" x2="455.2" y2="237.0" stroke="#4b535d" stroke-width="1.5"/>
<path d="M460.0,237.0 L454.8,240.0 L454.8,234.0 z" fill="#4b535d"/>
<rect x="462.0" y="214.0" width="124.0" height="46.0" rx="8" fill="#dde7fb" stroke="#3a6fd8" stroke-width="1.2"/>
<text x="524.0" y="234.0" font-size="12.5" fill="#1f2328" font-weight="600" text-anchor="middle">your app</text>
<text x="524.0" y="251.0" font-size="10.5" fill="#4b535d" text-anchor="middle">Python</text>
<line x1="588.0" y1="237.0" x2="601.2" y2="237.0" stroke="#4b535d" stroke-width="1.5"/>
<path d="M606.0,237.0 L600.8,240.0 L600.8,234.0 z" fill="#4b535d"/>
<rect x="608.0" y="214.0" width="124.0" height="46.0" rx="8" fill="#d3f1ec" stroke="#13968e" stroke-width="1.2"/>
<text x="670.0" y="234.0" font-size="12.5" fill="#1f2328" font-weight="600" text-anchor="middle">encode reply</text>
<text x="670.0" y="251.0" font-size="10.5" fill="#4b535d" text-anchor="middle">Rust</text>
<line x1="734.0" y1="237.0" x2="747.2" y2="237.0" stroke="#4b535d" stroke-width="1.5"/>
<path d="M752.0,237.0 L746.8,240.0 L746.8,234.0 z" fill="#4b535d"/>
<rect x="754.0" y="214.0" width="124.0" height="46.0" rx="8" fill="#d3f1ec" stroke="#13968e" stroke-width="1.2"/>
<text x="816.0" y="234.0" font-size="12.5" fill="#1f2328" font-weight="600" text-anchor="middle">write</text>
<text x="816.0" y="251.0" font-size="10.5" fill="#4b535d" text-anchor="middle">corked</text>
<text x="24.0" y="282.0" font-size="11.5" fill="#4b535d">Python runs one step: your application.</text>
<rect x="440.0" y="302.0" width="14.0" height="12.0" rx="3" fill="#dde7fb"/>
<text x="460.0" y="312.0" font-size="11.5" fill="#4b535d">Python</text>
<rect x="520.6" y="302.0" width="14.0" height="12.0" rx="3" fill="#ebe3fb"/>
<text x="540.6" y="312.0" font-size="11.5" fill="#4b535d">C (libuv, selectors)</text>
<rect x="691.4" y="302.0" width="14.0" height="12.0" rx="3" fill="#d3f1ec"/>
<text x="711.4" y="312.0" font-size="11.5" fill="#4b535d">cadeloop, Rust</text>
</svg>
