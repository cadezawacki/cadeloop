<title>Closed-loop and open-loop load</title>
<rect width="900" height="380" rx="10" fill="#0B0D11"/>
<text x="24.0" y="34.0" font-size="16" fill="#e6edf3" font-weight="600">Closed-loop and open-loop load</text>
<text x="24.0" y="55.0" font-size="12.5" fill="#b1bac4">If the load generator waits for each answer before sending the next, a server stall also stalls the measurement.</text>
