<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>What the loop does, over and over</title>
<rect width="820" height="420" rx="10" fill="#fcfcfb"/>
<text x="24.0" y="34.0" font-size="16" fill="#1f2328" font-weight="600">What the loop does, over and over</text>
<text x="24.0" y="55.0" font-size="12.5" fill="#4b535d">One trip around is a tick. A busy server makes tens of thousands of ticks per second.</text>
<rect x="285.0" y="81.0" width="250.0" height="58.0" rx="10" fill="#dde7fb" stroke="#3a6fd8" stroke-width="1.2"/>
<text x="410.0" y="107.0" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle">1  Run the callbacks that are ready</text>
<text x="410.0" y="126.0" font-size="11.5" fill="#4b535d" text-anchor="middle">your coroutines resume here</text>
<rect x="540.0" y="216.0" width="250.0" height="58.0" rx="10" fill="#eceff2" stroke="#6e7781" stroke-width="1.2"/>
<text x="665.0" y="242.0" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle">2  Ask the OS what happened</text>
<text x="665.0" y="261.0" font-size="11.5" fill="#4b535d" text-anchor="middle">and sleep, if nothing is ready</text>
<rect x="285.0" y="351.0" width="250.0" height="58.0" rx="10" fill="#d3f1ec" stroke="#13968e" stroke-width="1.2"/>
<text x="410.0" y="377.0" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle">3  Turn finished I/O into callbacks</text>
<text x="410.0" y="396.0" font-size="11.5" fill="#4b535d" text-anchor="middle">data arrived, a send completed</text>
<rect x="30.0" y="216.0" width="250.0" height="58.0" rx="10" fill="#d3f1ec" stroke="#13968e" stroke-width="1.2"/>
<text x="155.0" y="242.0" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle">4  Queue timers that came due</text>
<text x="155.0" y="261.0" font-size="11.5" fill="#4b535d" text-anchor="middle">asyncio.sleep(), call_later()</text>
<path d="M515.0,139.0 Q655.0,151.3 645.9,210.5" fill="none" stroke="#4b535d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M645.0,216.0 L642.5,209.5 L649.4,210.5 z" fill="#4b535d"/>
<path d="M645.0,274.0 Q655.0,338.7 520.6,350.5" fill="none" stroke="#4b535d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M515.0,351.0 L520.7,347.0 L521.3,354.0 z" fill="#4b535d"/>
<path d="M305.0,351.0 Q165.0,338.7 174.1,279.5" fill="none" stroke="#4b535d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M175.0,274.0 L177.5,280.5 L170.6,279.5 z" fill="#4b535d"/>
<path d="M175.0,216.0 Q165.0,151.3 299.4,139.5" fill="none" stroke="#4b535d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M305.0,139.0 L299.3,143.0 L298.7,136.0 z" fill="#4b535d"/>
<text x="410.0" y="241.0" font-size="14" fill="#4b535d" font-weight="600" text-anchor="middle">one tick</text>
<text x="410.0" y="260.0" font-size="11.5" fill="#7d8590" text-anchor="middle">then the next</text>
</svg>
