<text x="24.0" y="34.0" font-size="16" fill="#e6edf3" font-weight="600">Spin, then park</text>
<text x="24.0" y="55.0" font-size="12.5" fill="#b1bac4">Before it sleeps, the loop checks for new work for a few microseconds. Work that arrives then skips a sleep.</text>
<text x="24.0" y="102.0" font-size="12.5" fill="#e6edf3" font-weight="600">work arrives mid-spin</text>
