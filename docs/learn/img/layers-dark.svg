<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>cadeloop's layers</title>
<rect width="840" height="470" rx="10" fill="#0B0D11"/>
<text x="24.0" y="34.0" font-size="16" fill="#e6edf3" font-weight="600">cadeloop's layers</text>
<text x="24.0" y="55.0" font-size="12.5" fill="#b1bac4">Under your code there is a thin Python layer for the asyncio API; everything below it is Rust.</text>
<rect x="24.0" y="78.0" width="560.0" height="50.0" rx="9" fill="#172a4f" stroke="#79a5f2" stroke-width="1.2"/>
<text x="42.0" y="99.0" font-size="13.5" fill="#e6edf3" font-weight="600">Your code</text>
<text x="42.0" y="117.0" font-size="11.5" fill="#b1bac4">asyncio programs, FastAPI, Starlette, aiohttp, uvicorn</text>
<text x="568.0" y="108.0" font-size="11" fill="#79a5f2" font-weight="600" text-anchor="end">Python</text>
<rect x="24.0" y="138.0" width="560.0" height="50.0" rx="9" fill="#172a4f" stroke="#79a5f2" stroke-width="1.2"/>
<text x="42.0" y="159.0" font-size="13.5" fill="#e6edf3" font-weight="600">cadeloop, Python layer</text>
<text x="42.0" y="177.0" font-size="11.5" fill="#b1bac4">Loop (the asyncio API) · Config · serve() · the CLI</text>
<text x="568.0" y="168.0" font-size="11" fill="#79a5f2" font-weight="600" text-anchor="end">Python</text>
<rect x="24.0" y="198.0" width="560.0" height="50.0" rx="9" fill="#0e3733" stroke="#36c2b6" stroke-width="1.2"/>
<text x="42.0" y="219.0" font-size="13.5" fill="#e6edf3" font-weight="600">Bindings and HTTP engine</text>
<text x="42.0" y="237.0" font-size="11.5" fill="#b1bac4">callbacks, transports, HTTP and WebSocket parsing, ASGI</text>
<text x="568.0" y="228.0" font-size="11" fill="#36c2b6" font-weight="600" text-anchor="end">Rust</text>
<rect x="24.0" y="258.0" width="560.0" height="50.0" rx="9" fill="#0e3733" stroke="#36c2b6" stroke-width="1.2"/>
<text x="42.0" y="279.0" font-size="13.5" fill="#e6edf3" font-weight="600">Reactor</text>
<text x="42.0" y="297.0" font-size="11.5" fill="#b1bac4">ready queue, timer heap, cross-thread queue, spin-then-park</text>
<text x="568.0" y="288.0" font-size="11" fill="#36c2b6" font-weight="600" text-anchor="end">Rust</text>
<rect x="24.0" y="318.0" width="560.0" height="50.0" rx="9" fill="#0e3733" stroke="#36c2b6" stroke-width="1.2"/>
<text x="42.0" y="339.0" font-size="13.5" fill="#e6edf3" font-weight="600">Backends</text>
<text x="42.0" y="357.0" font-size="11.5" fill="#b1bac4">IOCP on Windows · epoll on Linux · RIO (experimental)</text>
<text x="568.0" y="348.0" font-size="11" fill="#36c2b6" font-weight="600" text-anchor="end">Rust</text>
<rect x="24.0" y="378.0" width="560.0" height="50.0" rx="9" fill="#232830" stroke="#8b949e" stroke-width="1.2"/>
<text x="42.0" y="399.0" font-size="13.5" fill="#e6edf3" font-weight="600">Operating system</text>
<text x="42.0" y="417.0" font-size="11.5" fill="#b1bac4">sockets, timers, the network stack</text>
<text x="568.0" y="408.0" font-size="11" fill="#8b949e" font-weight="600" text-anchor="end">kernel</text>
<path d="M608,78 h10 V316 h-10" fill="none" stroke="#79a5f2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="628.0" y="198.0" font-size="11.5" fill="#b1bac4">Python's GIL is held</text>
<text x="628.0" y="213.0" font-size="11.5" fill="#b1bac4">while the loop runs</text>
<text x="628.0" y="228.0" font-size="11.5" fill="#b1bac4">callbacks and code</text>
<rect x="608.0" y="326.0" width="220.0" height="52.0" rx="8" fill="#3d2711" stroke="#f0a050" stroke-width="1.2"/>
<text x="620.0" y="346.0" font-size="11.5" fill="#e6edf3">GIL released only here, while</text>
<text x="620.0" y="361.0" font-size="11.5" fill="#e6edf3">the backend waits for I/O</text>
</svg>
