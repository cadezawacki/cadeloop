<text x="434.0" y="272.0" font-size="11" fill="#7d8590" text-anchor="middle">latency →</text>
<text x="24.0" y="300.0" font-size="11.5" fill="#4b535d">Illustrative shape, not a measurement. p99 is the latency that 1 request in 100 exceeds: at 10,000</text>
<text x="24.0" y="315.0" font-size="11.5" fill="#4b535d">requests per second, that is 100 slow answers every second.</text>
