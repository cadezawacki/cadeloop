[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "cadeloop"
description = "Maximum-performance asyncio event loop + ASGI stack for Windows / CPython 3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Cade Zawacki" }]
# R-010: CPython 3.11.x only for v1 (cp311-win_amd64 wheels; abi3 not used).
requires-python = ">=3.11,<3.12"
keywords = [
    "asyncio",
    "event-loop",
    "asgi",
    "asgi-server",
    "http",
    "websockets",
    "iocp",
    "windows",
    "rust",
    "performance",
    "uvloop",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dynamic = ["version"]

# `python -m cadeloop` still works; this is the same entry point under a
# name that lands on PATH, which is what a reader coming from `uvicorn`
# or `gunicorn` will reach for first.
[project.scripts]
cadeloop = "cadeloop.__main__:main"

[project.urls]
Homepage = "https://github.com/cadezawacki/cadeloop"
Documentation = "https://github.com/cadezawacki/cadeloop#readme"
Repository = "https://github.com/cadezawacki/cadeloop"
Issues = "https://github.com/cadezawacki/cadeloop/issues"
Changelog = "https://github.com/cadezawacki/cadeloop/releases"

[tool.maturin]
manifest-path = "crates/pyshim/Cargo.toml"
python-source = "python"
module-name = "cadeloop._core"
strip = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/conformance"]
addopts = "-q"

[tool.ruff]
# Matches rustfmt.toml's max_width, so both halves of the codebase wrap at
# the same column instead of each having its own idea.
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Deliberately bug-shaped rather than style-shaped. E/F are the pyflakes
# core (undefined names, unused imports and variables -- the class that
# hides a dropped assertion or a forgotten call); B is bugbear; ASYNC
# catches blocking work on the loop thread, which for an event loop is the
# defect that matters most; I keeps imports ordered so diffs stay small.
# Explicitly NOT enabled: BLE001 (blind excepts are deliberate and
# documented throughout -- a writer thread that dies on a handler's
# exception is worse than one that logs it) and the TRY/SIM/UP families,
# which would fight stdlib-parity choices (asyncio itself raises
# ValueError for a non-string cmd, which TRY004 wants to be TypeError).
select = ["E", "F", "B", "ASYNC", "I"]

[tool.ruff.lint.per-file-ignores]
# Tests open files and poll with sleep() on purpose: they are not serving
# traffic, and rewriting them around anyio would obscure what they check.
"tests/**" = ["ASYNC230", "ASYNC240", "ASYNC109", "ASYNC110", "E741", "B023"]
